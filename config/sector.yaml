# RASAD sector definition: one Ladakh sector, 42 posts, 3 formations, 5 depots, 4 passes.
#
# READ THIS BEFORE USING THE COORDINATES
#   * Post, depot and pass positions are approximate place-name centroids (roughly +/-5-10 km)
#     taken from public gazetteer-level knowledge. They are NOT surveyed positions.
#   * The posts are a simulation scaffold. They are not actual deployment sites, and the troop
#     numbers are invented. Verify every coordinate and altitude against survey data before using
#     distances or travel times for anything beyond the demo.
#   * `via_pass` is a deliberate simplification: the single pass that gates the post's main
#     resupply lane in this model. Real lanes have alternates.
#
# Posts are grouped by formation first, then by gating pass.

timeline:
  # Winter seasons run 1 Oct (first_winter) to 31 Mar (first_winter + 1). A season is named by its
  # start year, so 2021 is winter 2021-22 and 2025 is winter 2025-26.
  first_winter: 2021
  last_winter: 2025
  season_start: "10-01"
  season_end: "03-31"
  # The last winter is held out for forecast evaluation; the models never train on it.
  holdout_winter: 2025

formations:
  F1: { name: "Western sector (Drass - Kargil - Suru - Zanskar)", history_start: "2021-10-01" }
  F2: { name: "Central sector (Leh - Nubra - Indus valley)", history_start: "2021-10-01" }
  # F3 is newly inducted: it only has data from winter 2024-25. This is the data-poor case where
  # federated learning is supposed to help.
  F3: { name: "Eastern sector (Changthang - Hanle - Nyoma)", history_start: "2024-10-01" }

depots:
  - { id: LEH, name: "Leh", lat: 34.15, lon: 77.58, altitude_m: 3500 }
  - { id: KARGIL, name: "Kargil", lat: 34.55, lon: 76.13, altitude_m: 2676 }
  - { id: DRASS, name: "Drass", lat: 34.43, lon: 75.76, altitude_m: 3280 }
  - { id: TANGTSE, name: "Tangtse", lat: 34.03, lon: 78.27, altitude_m: 4000 }
  - { id: NYOMA, name: "Nyoma", lat: 33.20, lon: 78.65, altitude_m: 4100 }

passes:
