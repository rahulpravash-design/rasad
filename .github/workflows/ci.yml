name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Lint (ruff)
        run: ruff check . && ruff format --check .
      - name: Tests (pytest)
        run: pytest -q
      - name: make data is deterministic (fixed seed)
        run: make data-check PY=python

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: MapLibre worker is emitted as its own asset
        # Without it the production map silently fails ("Worker failed to load") because the
        # server answers the missing file with index.html. See ui/src/components/SectorMap.tsx.
        run: ls dist/assets/maplibre-gl-worker-*.js
